name: Build and push ExApp image

# Publishing runs in CI on purpose: GITHUB_TOKEN is injected per-run, so no
# personal access token has to be created, shared or stored anywhere.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository_owner }}/done-transcription-app

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # the only privilege needed to push to ghcr

    steps:
      - uses: actions/checkout@v4

      # QEMU would only be needed for cross-arch (arm64) builds; amd64-only for
      # now, so it stays out.
      - uses: docker/setup-buildx-action@v3

      # GHCR_TOKEN (repo secret) is used when the org restricts GITHUB_TOKEN to
      # read-only package scope; otherwise GITHUB_TOKEN is enough.
      - name: Log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short

      # Build first, push second: separates a broken image from a broken publish.
      - name: Build only (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE }}:ci-check
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # amd64 only for now; add arm64 when a target needs it.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
